<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found · Carnac</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0a0810">
  <link rel="icon" type="image/png" href="/icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
  <link rel="stylesheet" href="/assets/site.css">
  <style>
    .lost { min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 40px 16px; background: radial-gradient(60% 60% at 50% 60%, rgba(113, 0, 179, 0.3), transparent 70%); }
    .lost .ov-msg { display: inline-flex; margin-bottom: 28px; font: 700 22px/1.25 var(--font); animation: none; }
    .lost p { color: var(--text-2); margin: 0 0 28px; }
  </style>
</head>
<body>
  <main class="lost">
    <div>
      <div class="ov-msg"><span class="ov-cap">Ctrl</span> + <span class="ov-cap">Z</span><span class="ov-name">&nbsp;[Undo]</span></div>
      <h1>Page not found</h1>
      <p>That page doesn't exist, but the overlay is still waiting for you.</p>
      <a class="btn btn-primary" href="/">Back to Carnac</a>
    </div>
  </main>
</body>
</html>
